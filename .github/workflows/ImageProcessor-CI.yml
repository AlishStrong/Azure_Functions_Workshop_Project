
name: Build and Test ImageProcessor Azure Function App

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  AZURE_FUNCTIONAPP_NAME: 'ImageProcessor'   # set this to your function app name on Azure
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './ImageProcessor'
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test ImageProcessor

    steps:

    - name: Checkout branch
      uses: actions/checkout@v4

    - name: Setup .NET v${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore ImageProcessor dependencies
      run: |
        dotnet restore ImageProcessor/ImageProcessor.csproj
        dotnet restore ImageProcessor.Tests/ImageProcessor.Tests.csproj

    - name: Build ImageProcessor
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        dotnet build --configuration Release --no-restore --output ./output
        popd

    - name: Build ImageProcessor.Tests
      run: dotnet build ImageProcessor.Tests/ImageProcessor.Tests.csproj --configuration Release --no-restore
    
    - name: Run ImageProcessor unit tests
      run: dotnet test ImageProcessor.Tests/ImageProcessor.Tests.csproj --configuration Release --no-build --verbosity normal
    
    - name: 'Deploy ImageProcessor'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
